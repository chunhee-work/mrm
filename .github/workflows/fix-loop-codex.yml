# fix-loop: the Codex review loop on the owner's PRs labelled `loop:codex` (see fix-loop.config.json), plus a sweep
# every 15 minutes for Codex silence, missed events and `loop:ok` approvals. Every other PR is left alone.
name: fix-loop-codex

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty runs the sweep)
        type: string
        required: false

permissions:
  contents: read
  checks: read

jobs:
  pr:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr != '') ||
      (github.event.pull_request && contains(github.event.pull_request.labels.*.name, 'loop:codex')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'loop:codex') &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    concurrency:
      group: fix-loop-codex-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/fix-loop.mjs
            fix-loop.config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: one loop step
        env:
          FIX_LOOP_ENABLED: ${{ vars.FIX_LOOP_ENABLED }}
          FIX_LOOP_TOKEN: ${{ secrets.FIX_LOOP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FIX_LOOP_TELEGRAM_BOT_TOKEN: ${{ secrets.FIX_LOOP_TELEGRAM_BOT_TOKEN }}
          FIX_LOOP_TELEGRAM_CHAT_ID: ${{ secrets.FIX_LOOP_TELEGRAM_CHAT_ID }}
          FIX_LOOP_WEBHOOK_URL: ${{ secrets.FIX_LOOP_WEBHOOK_URL }}
        run: node scripts/fix-loop.mjs pr "${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}"

  sweep:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
    concurrency:
      group: fix-loop-sweep
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/fix-loop.mjs
            fix-loop.config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sweep
        env:
          FIX_LOOP_ENABLED: ${{ vars.FIX_LOOP_ENABLED }}
          FIX_LOOP_TOKEN: ${{ secrets.FIX_LOOP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          FIX_LOOP_TELEGRAM_BOT_TOKEN: ${{ secrets.FIX_LOOP_TELEGRAM_BOT_TOKEN }}
          FIX_LOOP_TELEGRAM_CHAT_ID: ${{ secrets.FIX_LOOP_TELEGRAM_CHAT_ID }}
          FIX_LOOP_WEBHOOK_URL: ${{ secrets.FIX_LOOP_WEBHOOK_URL }}
        run: node scripts/fix-loop.mjs sweep
