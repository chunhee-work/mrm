# Optional plan review (Grok + Dots). Ask on a plan issue by adding the label review:grok or review:dots, or by
# commenting «/review», «/review grok» or «/review dots». Off unless PLAN_REVIEW_ENABLED is true and planReview.enabled
# is true in fix-loop.config.json. The script and config come from the default branch.
name: plan-review

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: plan-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      !github.event.issue.pull_request && (
        (github.event_name == 'issues' && (github.event.label.name == 'review:grok' || github.event.label.name == 'review:dots')) ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/plan-review.mjs
            fix-loop.config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: which reviewer
        id: who
        env:
          LABEL: ${{ github.event.label.name }}
          BODY: ${{ github.event.comment.body }}
        run: |
          case "$LABEL" in review:grok) w=grok;; review:dots) w=dots;; *) w=both;; esac
          first=$(printf '%s' "$BODY" | head -n1 | tr -d '\r')
          case "$first" in "/review grok"*) w=grok;; "/review dots"*) w=dots;; esac
          echo "who=$w" >> "$GITHUB_OUTPUT"
      - name: ask
        env:
          PLAN_REVIEW_ENABLED: ${{ vars.PLAN_REVIEW_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROK_WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          GROK_WEBHOOK_SECRET: ${{ secrets.GROK_WEBHOOK_SECRET }}
        run: node scripts/plan-review.mjs review "${{ steps.who.outputs.who }}"
