# fix-loop: Claude fixes. It wakes on an issue labelled with one of `issueLabels` (or a CI issue the loop opened) from a
# trusted account, on the owner's `@claude` comment there or on a loop PR, and on the loop's own fix comment.
# The gate and its rules come from the default branch, never from a PR.
name: fix-loop-claude

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: fix-loop-claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/fix-loop.mjs
            fix-loop.config.json
          sparse-checkout-cone-mode: false
          path: gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: may Claude start?
        id: gate
        working-directory: gate
        env:
          FIX_LOOP_ENABLED: ${{ vars.FIX_LOOP_ENABLED }}
          FIX_LOOP_TOKEN: ${{ secrets.FIX_LOOP_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_PROMPT_FILE: ${{ runner.temp }}/loop-prompt.md
        run: node scripts/fix-loop.mjs claude-gate
      - name: the prompt
        if: steps.gate.outputs.run == 'true'
        id: prompt
        run: |
          {
            echo 'text<<FIX_LOOP_PROMPT_END'
            cat "${{ runner.temp }}/loop-prompt.md"
            echo 'FIX_LOOP_PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.FIX_LOOP_TOKEN }}
      - name: git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "${{ github.repository_owner }}-fix-loop"
          git config user.email "fix-loop@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.FIX_LOOP_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(pnpm:*),Bash(yarn:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git merge origin/:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git push origin HEAD\:fix-loop/:*),Bash(gh pr create --draft:*),Bash(gh pr checkout:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh issue close:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr ready:*),Bash(gh pr edit:*),Bash(gh issue edit:*),Bash(gh label:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git rebase:*),Bash(git reset --hard:*)"
        env:
          GH_TOKEN: ${{ secrets.FIX_LOOP_TOKEN }}
