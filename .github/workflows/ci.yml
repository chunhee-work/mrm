# CI: the check the fix loop watches (fix-loop-ci-failure.yml listens for this exact name, "CI").
# Autopilotclaim website only: checks run inside web/. Passes while web/package.json does not exist yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Local Postgres for the payment tests (web/tests). Throwaway, test data only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay
          POSTGRES_PASSWORD: pay
          POSTGRES_DB: paytest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pay:pay@localhost:5432/paytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install and check
        run: |
          if [ ! -f web/package.json ]; then echo "No web/package.json yet; nothing to check."; exit 0; fi
          cd web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm run typecheck --if-present
          if [ -f scripts/migrate.ts ]; then npx tsx scripts/migrate.ts; fi
          npm test --if-present
          SKIP_ENV_VALIDATION=1 npm run build --if-present
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: worker tests
        run: |
          python -m pip install -r worker/requirements.txt
          python -m pytest worker/tests -q
          node --test worker/cdp.test.mjs
