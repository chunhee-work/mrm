<title>🚙 照片命名台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f8;--surface:#ffffff;--raised:#f8fafc;--ink:#0f1720;--mut:#5b6776;--line:#dfe4ea;--acc:#4f5bd5;--accInk:#ffffff;--warn:#b45309;--ed:#0e7490;--edbg:#dcf1f6;--jev:#86369e;--jevbg:#f3e6f7;--ok:#15803d;--okInk:#ffffff;--shadow:0 1px 2px rgba(15,23,32,.06),0 4px 14px rgba(15,23,32,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--surface:#121821;--raised:#18202b;--ink:#e7ecf2;--mut:#8b97a6;--line:#243041;--acc:#8b93ff;--accInk:#0b0f14;--warn:#fbbf24;--ed:#22d3ee;--edbg:#0b2a31;--jev:#e3a6f5;--jevbg:#2c1834;--ok:#4ade80;--okInk:#0b0f14;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f14;--surface:#121821;--raised:#18202b;--ink:#e7ecf2;--mut:#8b97a6;--line:#243041;--acc:#8b93ff;--accInk:#0b0f14;--warn:#fbbf24;--ed:#22d3ee;--edbg:#0b2a31;--jev:#e3a6f5;--jevbg:#2c1834;--ok:#4ade80;--okInk:#0b0f14;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Noto Sans SC","PingFang SC",sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{padding:8px 16px;display:flex;flex-wrap:nowrap;gap:8px;align-items:center}  /* user 2026-11-04: case tabs as long as possible, the rest small */
@media (max-width:560px){.top .in{flex-wrap:wrap}.tabs{order:9;flex-basis:100%}}
.brand{font-weight:700;font-size:13px;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.tab{flex:none;min-height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.tab:hover{border-color:var(--acc)}
.tabarr{flex:none;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:inherit;font:700 16px system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabarr:hover{border-color:var(--acc)}.tabarr:disabled{opacity:.3;cursor:default}
.tab .p{font:600 14px "IBM Plex Mono",monospace}
.tab .c{font-size:12px;color:var(--mut)}
.card.kc{outline:3px solid var(--acc);outline-offset:2px}
/* 2026-11-06 user (option A): Space -> palette to add parts with no photo; chips under the plate */
:root{--add:#7c3aed;--addbg:#efe7fd;--scrim:rgba(15,23,32,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--add:#c4a5ff;--addbg:#241a3a;--scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--add:#c4a5ff;--addbg:#241a3a;--scrim:rgba(0,0,0,.6)}
.xstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 0}
.xstrip .lab{font-size:12px;font-weight:700;color:var(--add);letter-spacing:.03em}
.xchip{display:inline-flex;align-items:center;gap:4px;background:var(--addbg);color:var(--add);border:1px solid var(--add);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:600}
.xchip button{border:0;background:transparent;color:inherit;cursor:pointer;min-width:24px;min-height:24px;border-radius:999px;font-size:15px;line-height:1}
.xadd{border:1px dashed var(--add);background:transparent;color:var(--add);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:28px}
.xscrim[hidden]{display:none!important}
.xscrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
.xpal{width:min(560px,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.xin{display:flex;align-items:center;gap:10px;border:2px solid var(--add);border-radius:12px;padding:6px 10px;background:var(--surface)}
.xin input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:16px "IBM Plex Sans","Noto Sans SC",sans-serif;min-height:34px}
.xsug{display:flex;flex-direction:column;max-height:40vh;overflow:auto}
.xsug button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;padding:9px 12px;font-size:14px;border-radius:8px;cursor:pointer;color:var(--ink)}
.xsug button[aria-selected="true"]{background:var(--addbg)}
.xsug small{color:var(--mut);font:500 11.5px "IBM Plex Mono",monospace}
.xhint{font-size:12px;color:var(--mut)}
.kbd{font:600 11px "IBM Plex Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--raised)}
@media (hover:none){.card.kc{outline:none}}
.tab .dn{font:700 13px system-ui,sans-serif;width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--ok);color:var(--okInk)}
.tab .edc{font:700 12px "IBM Plex Mono","Noto Sans SC",monospace;padding:3px 9px;border-radius:999px;background:var(--ed);color:var(--bg);box-shadow:0 0 0 2px var(--surface)}
.tab[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:var(--accInk)}.tab[aria-current="true"] .c{color:inherit;opacity:.85}
.seg{flex:none;display:flex;padding:2px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:28px;padding:0 9px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 72px;display:flex;flex-direction:column;gap:16px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
@media (max-width:760px){.head{grid-template-columns:1fr}}
.plate{font:700 30px/1.1 "IBM Plex Mono",monospace;letter-spacing:.02em;margin:0}
.veh{color:var(--mut);margin-top:6px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{min-width:104px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.kpi .k{font-size:12px;color:var(--mut);letter-spacing:.04em}.kpi .v{font:700 22px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.kpi.warn .v{color:var(--warn)}.kpi.ed .v{color:var(--ed)}
.legend{font-size:13px;color:var(--mut)}.legend summary{cursor:pointer;width:max-content;min-height:28px}
.legend .row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}  /* user 2026-10-30: always 2 columns (left + right), every photo and view the same size */
@media (max-width:560px){.grid{gap:8px}}  /* user 2026-10-30: name box + Copy + Paste stay on one row at the same size on every screen */
.card{position:relative;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.warn{border-color:var(--warn)}.card.edited{border-color:var(--ed)}
.card.warn::before,.card.edited::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn);z-index:1}.card.edited::before{background:var(--ed)}
.ph{position:relative;aspect-ratio:4/3;background:var(--raised)}
.ph img{display:block;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;user-select:none}
.ph{cursor:grab}.card.dragging{opacity:.4}.card.over{outline:3px dashed var(--acc);outline-offset:-3px}
.grip{position:absolute;bottom:10px;left:12px;font:600 12px "Noto Sans SC",sans-serif;padding:4px 9px;border-radius:999px;background:rgba(10,14,20,.75);color:#fff}
.ov{position:absolute;top:10px;display:flex;gap:6px}.ov.l{left:12px}.ov.r{right:10px}
.badge{font:600 12px "IBM Plex Mono","Noto Sans SC",monospace;padding:4px 9px;border-radius:999px;background:rgba(10,14,20,.75);color:#fff}
.badge.ok{background:#15803d}.badge.low{background:#b45309}.badge.rule{background:#4f5bd5}
.body{padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:10px}
.namerow{display:flex;gap:8px;align-items:stretch}
.nm{flex:1;min-width:0;min-height:48px;text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--raised);font-weight:700;font-size:16px;cursor:text;word-break:break-word;transition:border-color .15s,background .15s}
.nm:hover{border-color:var(--acc);background:var(--surface)}
.nmin{flex:1;min-width:0;min-height:48px;font:700 16px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:10px 14px;border:2px solid var(--acc);border-radius:10px;background:var(--surface);color:var(--ink)}
.paste{flex:none;min-width:68px;min-height:48px;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:600;cursor:pointer;transition:background .15s}
.paste.rst{min-height:40px;min-width:68px;padding:0 14px}
.paste:hover{background:var(--raised)}
/* user 2026-10-30: every card looks like the desktop one at any screen width — name box wide, Copy/Paste compact; sizes scale with the card (container units) */
.card{container-type:inline-size}
.namerow{display:grid;grid-template-columns:minmax(0,1fr) 18cqw 18cqw;gap:2cqw}
.nm,.nmin{min-height:clamp(34px,12cqw,72px);padding:1.6cqw 3cqw;font-size:clamp(11px,3.6cqw,22px)}
.namerow .paste{min-width:0;min-height:clamp(34px,12cqw,72px);padding:0;font-size:clamp(8px,3.4cqw,20px)}
@media (hover:none){.nmin{font-size:16px}.grip{display:none}}  /* phone: dragging does not work with a finger, the pill only hid the photo */
@container (max-width:260px){.namerow{grid-template-columns:minmax(0,1fr) 15cqw 15cqw;gap:1.5cqw}.nm{padding:1.6cqw 2.4cqw}.namerow .paste{font-size:clamp(8px,3.2cqw,20px)}}  /* phone: more room for the name */
.nm{overflow-wrap:break-word;word-break:normal;hyphens:auto}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:24px}
.chip{font:600 12px "IBM Plex Mono","Noto Sans SC",monospace;padding:3px 9px;border-radius:999px;border:0}
.jev{color:var(--jev);background:var(--jevbg)}.ed{color:var(--ed);background:var(--edbg)}
button.chip{cursor:pointer;min-height:28px}
.src{margin-left:auto;font:500 12px "IBM Plex Mono",monospace;color:var(--mut)}
.alts{display:flex;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:6px;align-items:center;font-size:13px;color:var(--mut);padding-bottom:2px}
.alts span{flex:none}.alts button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:13px}
.alts button:hover{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow);z-index:9}
.empty{padding:40px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.donebtn{flex:none;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--ok);background:transparent;color:var(--ok);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.donebtn.ask{background:var(--warn);border-color:var(--warn);color:var(--accInk)}.donebtn.ok{background:var(--ok);border-color:var(--ok);color:var(--okInk)}
@container (max-width:420px){.alts{flex-wrap:wrap;overflow-x:visible;white-space:normal}.alts span{flex-basis:100%}.alts button{flex:1 1 100%;text-align:left;min-height:40px;padding:6px 12px;border-radius:10px;white-space:normal}}  /* user 2026-11-09 phone: 其他可能 all visible, one per line, no side scrolling */  /* 2026-11-09 phone: iOS zooms in on inputs under 16px */
@media (hover:none) and (max-width:700px){.namerow{grid-template-columns:1fr 1fr;gap:8px}.namerow .nm,.namerow .nmin{grid-column:1/-1}.namerow .paste{min-height:44px;font-size:15px;border-radius:10px}}  /* user 2026-11-09 phone only: name on its own line, Copy + Paste bigger on one line below */
@media (max-width:560px){.tabs{flex:1 1 100%;order:9}.donebtn{margin-left:auto;min-height:36px;padding:0 14px;font-size:13px}}  /* user 2026-11-09 phone: 完成 top right, the case tabs get the whole second row */
</style>
<header class="top"><div class="in">
 <button class="tabarr" id="tabL" aria-label="上一个案件 / 向左">‹</button>
 <nav class="tabs" id="tabs" aria-label="案件"></nav>
 <button class="tabarr" id="tabR" aria-label="下一个案件 / 向右">›</button>
 <div class="seg" role="group" aria-label="筛选"><button id="fAll" aria-pressed="true">全部</button><button id="fLow" aria-pressed="false">要确认</button><button id="fEd" aria-pressed="false">已改</button></div>
 <button class="donebtn" id="doneBtn" title="这个案件命名好后按这里（按两次），Claude 马上做这个案件的 Step 2">完成</button>
</div></header>
<main>
 <section class="head">
  <div><h1 class="plate" id="plate"></h1><div class="veh" id="veh"></div><div class="xstrip" id="xstrip" aria-label="要选的零件（没照片）"></div></div>
  <div class="kpis" id="kpis"></div>
 </section>
 <details class="legend"><summary>图例与用法</summary><div class="row">
  <span><span class="badge ok">95%</span> 模型有把握</span><span><span class="badge low">70%</span> 低于 90% 要确认（橙色边；按「要确认」只看这些）</span><span><span class="badge rule">固定</span> 开头 4 个角度 + Interior View</span><span><span class="chip jev">TypeSafe</span> 问过第二意见</span><span><span class="chip ed">已改</span> 你改过（蓝色边）</span>
  <span>拖照片可以调整顺序，名称会跟着照片走。</span><span>点名称框就能改：从清单选一个就马上保存，打字的话停手 1 秒自动保存（Esc 取消）。按一下 Paste 就换成你最后复制的名称（在这个页面里复制的一定可以；从别的 App 复制的，浏览器不让读时会改成输入框，再按 ⌘V）。</span></div></details>
 <datalist id="names"></datalist>
 <section class="grid" id="grid"></section>
</main>
<div class="xscrim" id="xscrim" hidden><div class="xpal" role="dialog" aria-modal="true" aria-label="加零件（没照片）">
 <div class="xin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><input id="xinput" autocomplete="off" placeholder="打零件名，例如 Bumper Clips" aria-label="零件名" aria-controls="xsug"><span class="kbd">Esc</span></div>
 <div class="xsug" id="xsug" role="listbox"></div>
 <div class="xstrip" id="xpchips" aria-label="已加的零件" style="padding:0 2px"></div>
 <div class="xhint"><span class="kbd">↑</span> <span class="kbd">↓</span> 选 · <span class="kbd">Enter</span> 加 · <span class="kbd">Esc</span> 关 · 加完还开着，可以一直加</div></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const DATA=__DATA__;const NAMES=__NAMES__;const CASES=Object.keys(DATA.rows);
const q=s=>document.querySelector(s);let ALL={},EDIT={},ORD={},db=null,filter="all",CASE=CASES[0],ROWS=DATA.rows[CASE],dragN=null;
const order=c=>{const base=DATA.rows[c].map(r=>r.n);const o=(ORD[c]||[]).filter(n=>base.includes(n));return o.concat(base.filter(n=>!o.includes(n)))};
const byN=c=>{const m={};DATA.rows[c].forEach(r=>m[r.n]=r);return m};
try{const h=location.hash.slice(1);if(DATA.rows[h]){CASE=h;ROWS=DATA.rows[h]}}catch(e){}
const NSET=new Set(NAMES);const dl=q("#names");NAMES.forEach(n=>{const o=document.createElement("option");o.value=n;dl.append(o)});
const LOW=0.9;  // 2026-11-04: batch 7, the user changed 90 of 92 renamed photos below 90% and 2 of 232 at >=90% -> "要确认" = below 90%
const low=r=>r.how==="model"&&r.conf<LOW;
const cur=r=>EDIT[r.n]?EDIT[r.n].name:r.name;
let tt;function toast(m){const t=q("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2600)}
// 2026-11-09: touch -> act on click only (pointerdown fired while swiping over a button)
function tap(b,fn){let done=0;b.addEventListener("pointerdown",ev=>{if(ev.button!==0||ev.pointerType!=="mouse")return;ev.preventDefault();done=Date.now();fn()});b.addEventListener("click",()=>{if(Date.now()-done>600)fn()})}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
var DONEC={};   // 2026-11-04 user: one 完成 per case -> db status/case_<PLATE>
function tabs(){const t=q("#tabs");t.innerHTML="";CASES.forEach(c=>{const b=el("button","tab");b.append(el("span","p",c));const n=ALL[c]?Object.keys(ALL[c]).length:0;b.append(el("span","c",DATA.rows[c].length+" 张"));if(n)b.append(el("span","edc","已改 "+n));if(DONEC[c])b.append(el("span","dn","✓"));b.setAttribute("aria-current",String(c===CASE));
 b.onclick=()=>{CASE=c;ROWS=DATA.rows[c];EDIT=ALL[c]||{};try{history.replaceState(null,"","#"+c)}catch(e){}tabs();render();window.scrollTo({top:0})};t.append(b)})}
// ---- 2026-11-06 user option A: Space -> add parts this car needs with no photo (db extras {case,name,at}) ----
let XTR={};const xid=(c,n)=>c+"-"+n.replace(/[^A-Za-z0-9]+/g,"_").slice(0,80);
function xchips(w,L){L.forEach(x=>{const c=el("span","xchip",x.name);const b=el("button",null,"×");b.setAttribute("aria-label","删除 "+x.name);b.onmousedown=ev=>ev.preventDefault();b.onclick=()=>{xdel(x);setTimeout(()=>q("#xinput").focus(),0)};c.append(b);w.append(c)})}
function xstrip(){const pc=q("#xpchips");if(pc){pc.innerHTML="";xchips(pc,XTR[CASE]||[])}   // user 2026-11-06: added parts also shown under the palette input
 const w=q("#xstrip");if(!w)return;w.innerHTML="";const L=(XTR[CASE]||[]);
 if(L.length)w.append(el("span","lab","要选的零件（没照片）"));
 L.forEach(x=>{const c=el("span","xchip",x.name);const b=el("button",null,"×");b.setAttribute("aria-label","删除 "+x.name);b.onclick=()=>xdel(x);c.append(b);w.append(c)});
 const a=el("button","xadd","＋ 加零件 (Space)");a.onclick=xopen;w.append(a)}
async function xsave(name){const c=CASE;name=name.replace(/\s+/g," ").trim();if(!name)return;
 if((XTR[c]||[]).some(x=>x.name.toLowerCase()===name.toLowerCase())){toast("已经有了："+name);return}
 if(!db){toast("还没连上，请稍等");return}
 const id=xid(c,name);
 try{await db.collection("extras").doc(id).set({id,case:c,name,at:Date.now()});undone(c);toast("已加："+name)}catch(e){toast("没保存成功，请再按一次")}}
async function xdel(x){if(!db)return;try{await db.collection("extras").doc(x.id).delete();undone(x.case);toast("已删："+x.name)}catch(e){toast("没删成功，请再按一次")}}
let XI=0,XL=[];
function xsug(){const v=q("#xinput").value.trim().toLowerCase();const w=v.split(/\s+/).filter(Boolean);const box=q("#xsug");box.innerHTML="";
 XL=w.length?NAMES.filter(n=>{const l=n.toLowerCase();return w.every(t=>l.includes(t))}).sort((a,b)=>a.length-b.length).slice(0,8):[];
 if(v&&!XL.some(n=>n.toLowerCase()===v))XL.push(q("#xinput").value.trim());
 XI=Math.min(XI,Math.max(0,XL.length-1));
 XL.forEach((n,i)=>{const b=el("button");b.setAttribute("role","option");b.setAttribute("aria-selected",String(i===XI));b.append(el("span",null,n),el("small",null,i===XI?"Enter":(NSET.has(n)?"":"新名称")));b.onmousedown=ev=>{ev.preventDefault();xsave(n);q("#xinput").value="";xsug()};box.append(b)})}
function xopen(){const s=q("#xscrim");s.hidden=false;const i=q("#xinput");i.value="";XI=0;xsug();setTimeout(()=>i.focus(),0)}
function xclose(){q("#xscrim").hidden=true}
q("#xscrim").addEventListener("mousedown",ev=>{if(ev.target.id==="xscrim")xclose()});
q("#xinput").addEventListener("input",()=>{XI=0;xsug()});
q("#xinput").addEventListener("keydown",ev=>{if(ev.key==="Escape"){ev.preventDefault();xclose()}

 const k=q("#kpis");k.innerHTML="";[["照片",ROWS.length,""],["要确认",ROWS.filter(low).length,"warn"],["你已改",Object.keys(EDIT).length,"ed"]].forEach(([a,b,c])=>{const d=el("div","kpi "+c);d.append(el("div","k",a),el("div","v",b));k.append(d)})}
// 2026-11-04 (user: loads too long): small copies first (pics/<P>_s.json), full ones after, current case first, then the
// others in tab order -> photos appear at once and tab switches are instant. Images are swapped in place (no re-render,
// so a name being typed is never lost).
const PIC={},FULL={};let LQ=null;
function swapPics(c){if(c!==CASE||!PIC[c])return;document.querySelectorAll("#grid img[data-n]").forEach(i=>{const v=PIC[c][i.dataset.n];if(v&&i.src!==v)i.src=v})}
async function getPics(c,full){const k=full?c:c+"_s";try{const j=await (await fetch("pics/"+k+".json")).json();if(full||!FULL[c]){PIC[c]=j;if(full)FULL[c]=true}swapPics(c)}catch(e){}}
async function loadAll(){const order=[CASE,...CASES.slice(CASES.indexOf(CASE)+1),...CASES.slice(0,CASES.indexOf(CASE))];
 await getPics(CASE,false);await getPics(CASE,true);for(const c of order.slice(1))if(!PIC[c])await getPics(c,false);for(const c of order.slice(1))if(!FULL[c])await getPics(c,true)}
function render(){const AN=anchor();if(!LQ)LQ=loadAll();else if(!PIC[CASE])getPics(CASE,false).then(()=>getPics(CASE,true));head();const g=q("#grid");g.style.minHeight=g.offsetHeight+"px";g.innerHTML="";const N=ROWS.length;let shown=0;const M=byN(CASE);const OO=order(CASE);
 OO.forEach((nn,pos)=>{const r=M[nn];const e=EDIT[r.n];if(filter==="low"&&!low(r))return;if(filter==="ed"&&!e)return;shown++;
  const f=el("figure","card"+(e?" edited":low(r)?" warn":"")+(KC===r.n?" kc":""));f.id="p"+r.n;f.addEventListener("mousemove",ev=>{if(Date.now()-KMOVE<600)return;if(ev.movementX||ev.movementY)setKC(r.n,false)});
  const ph=el("div","ph");const img=el("img");img.dataset.n=r.n;img.src=(PIC[CASE]&&PIC[CASE][r.n])||"";img.alt=cur(r);img.loading="lazy";ph.append(img);
  const ol=el("div","ov l");ol.append(el("span","badge",(pos+1)+"/"+N));ph.append(ol);if(filter==="all"){ph.append(el("span","grip","⠿ 拖动排序"));ph.draggable=true;
   ph.addEventListener("dragstart",ev=>{dragN=r.n;f.classList.add("dragging");try{ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",String(r.n))}catch(x){}});
   ph.addEventListener("dragend",()=>{dragN=null;f.classList.remove("dragging");document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"))});
   f.addEventListener("dragover",ev=>{if(dragN==null||dragN===r.n)return;ev.preventDefault();f.classList.add("over")});
   f.addEventListener("dragleave",()=>f.classList.remove("over"));
   f.addEventListener("drop",ev=>{ev.preventDefault();f.classList.remove("over");if(dragN==null||dragN===r.n)return;const o=order(CASE).filter(x=>x!==dragN);const i=o.indexOf(r.n);const from=order(CASE).indexOf(dragN);o.splice(from<order(CASE).indexOf(r.n)?i+1:i,0,dragN);saveOrder(o)})}
  const or=el("div","ov r");or.append(r.how==="rule"?el("span","badge rule","固定"):el("span","badge "+(r.conf<LOW?"low":"ok"),Math.round(r.conf*100)+"%"));ph.append(or);
  const bd=el("figcaption","body");const nr=el("div","namerow");
  const nm=el("button","nm",cur(r));nm.title="点一下改名称";nm.onclick=()=>edit(r,f);
  const cb=el("button","paste","Copy");cb.title="复制这个名称";tap(cb,()=>copyName(cur(r)));const pb=el("button","paste","Paste");pb.title="粘贴你复制的名称";tap(pb,()=>pasteNow(r,f));nr.append(nm,cb,pb);bd.append(nr);
  const m=el("div","meta");if(r.jev&&r.how!=="rule")m.append(el("span","chip jev","TypeSafe"));
  if(e){m.append(el("span","chip ed","已改 · 原："+r.name));const u=el("button","paste rst","还原");tap(u,()=>save(r,null));m.append(u)}
  m.append(el("span","src",r.src));bd.append(m);
  const opts=[r.name,...(r.how==="rule"?[]:r.alts)].filter(x=>x!==cur(r));
  if(opts.length&&(low(r)||e)){const a=el("div","alts");a.append(el("span",null,"其他可能"));opts.forEach(x=>{const b=el("button",null,x);tap(b,()=>save(r,x===r.name?null:x));a.append(b)});bd.append(a)}
  f.append(ph,bd);g.append(f)});
 if(!shown)g.append(el("div","empty",filter==="ed"?"这个案件还没有改过的照片。":"这个案件没有要确认的照片。"));g.style.minHeight="";restore(AN)}
// 2026-11-09 user (phone: "when I click it, it will jump every time"): every save / db update redraws the cards; keep the card
// nearest the middle of the screen at the same height so nothing moves. A case switch (scrollTo 0) is not affected.
function anchor(){const cs=document.querySelectorAll("#grid .card");if(!cs.length)return null;const mid=innerHeight/2;let best=null,bd=1e9;
 cs.forEach(c=>{const r=c.getBoundingClientRect();const d=Math.abs(r.top+r.height/2-mid);if(d<bd){bd=d;best={id:c.id,top:r.top,y:scrollY}}});return best}
function restore(a){if(!a)return;const c=document.getElementById(a.id);if(!c)return;const dy=c.getBoundingClientRect().top-a.top;if(Math.abs(dy)>1)window.scrollTo(0,scrollY+dy)}
function edit(r,f,paste){const nm=f.querySelector(".nm");if(!nm)return;const inp=el("input","nmin");inp.setAttribute("list","names");inp.value=paste?"":cur(r);if(paste)inp.placeholder="按 ⌘V（或 Ctrl+V）粘贴";inp.id="in-"+CASE+"-"+r.n;inp.setAttribute("aria-label","照片 "+r.n+" 的名称");
 nm.replaceWith(inp);inp.focus({preventScroll:true});inp.select();let done=false;
 const fin=ok=>{if(done)return;done=true;const v=inp.value.replace(/\s+/g," ").trim();if(ok&&v&&v!==cur(r))save(r,v===r.name?null:v);else render()};
 inp.addEventListener("paste",ev=>{const tx=(ev.clipboardData&&ev.clipboardData.getData("text")||"").replace(/\s+/g," ").trim();if(!tx)return;ev.preventDefault();inp.value=tx;fin(true)});
 inp.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();fin(true)}else if(ev.key==="Escape"){ev.preventDefault();fin(false)}};inp.onblur=()=>fin(true);
 // save without Enter: a name picked from the list saves at once; typed text saves 3 s after the last key (user 2026-10-23)
 let tm;inp.addEventListener("input",ev=>{clearTimeout(tm);const v=inp.value.replace(/\s+/g," ").trim();if(!v)return;if(NSET.has(v)&&(!ev.inputType||ev.inputType==="insertReplacementText")){fin(true);return}tm=setTimeout(()=>fin(true),3000)})}
let CLIP="",UNDO=[];
// 2026-11-04 (user: faster naming) keyboard on a computer: the card under the mouse (or moved to with J/K) is "current".
// user 2026-11-04: J/↑ previous · K/↓ next · 1/2/3 = pick that "其他可能" option · E edit · Enter Enter = 完成 this case and go right · C copy · V paste · ⌘Z / Ctrl+Z undo the last change · < / > previous / next case
let KC=null,KMOVE=0;function setKC(n,scroll){if(scroll)KMOVE=Date.now();if(KC===n)return;const o=document.getElementById("p"+KC);if(o)o.classList.remove("kc");KC=n;const f=document.getElementById("p"+n);if(f){f.classList.add("kc");if(scroll){const r=f.getBoundingClientRect();window.scrollTo({top:scrollY+r.top-(innerHeight-r.height)/2,behavior:"smooth"})}}}
document.addEventListener("keydown",ev=>{const t=ev.target;const inField=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA");
 if((ev.metaKey||ev.ctrlKey)&&!ev.shiftKey&&ev.key.toLowerCase()==="z"&&!inField){ev.preventDefault();const u=UNDO.pop();if(!u){toast("没有可以撤销的");return}
  if(u.c!==CASE){const b=[...document.querySelectorAll("#tabs .tab")].find(x=>x.querySelector(".p").textContent===u.c);if(b)b.click()}
  save(u.r,u.prev,true).then(()=>{setKC(u.r.n,true);toast("已撤销：第 "+u.r.n+" 张 → "+(u.prev||u.r.name))});return}
 if(ev.metaKey||ev.ctrlKey||ev.altKey||inField)return;
 if(ev.key===" "&&!(t&&t.tagName==="BUTTON")){ev.preventDefault();xopen();return}
 if(ev.key==="Enter"&&!(t&&t.tagName==="BUTTON")){ev.preventDefault();const now=Date.now();   // user 2026-11-04: Enter Enter = this case 完成 + go to the right case
  if(now-(window.__ent||0)<700){window.__ent=0;if(!db){toast("还没连上，请稍等");return}const c=CASE,i=CASES.indexOf(c);
   (DONEC[c]?Promise.resolve():setDone(c,true)).then(()=>{DONEC[c]=true;tabs();doneUI();if(i<CASES.length-1)q("#tabR").click();else toast("最后一个案件了")})}
  else{window.__ent=now;toast("再按一次 Enter：完成 "+CASE+" 并到右边的案件")}return}
 if(ev.key==="ArrowLeft"||ev.key==="<"||ev.key===","){ev.preventDefault();q("#tabL").click();return}   // user 2026-11-04: < left case, > right case
 if(ev.key==="ArrowRight"||ev.key===">"||ev.key==="."){ev.preventDefault();q("#tabR").click();return}
 const cards=[...document.querySelectorAll("#grid figure.card")];if(!cards.length)return;const k=ev.key.toLowerCase();
 let i=cards.findIndex(f=>f.id==="p"+KC);
 if(k==="k"||k==="arrowdown"){ev.preventDefault();setKC(+cards[Math.min(cards.length-1,i+1)].id.slice(1),true);return}
 if(k==="j"||k==="arrowup"){ev.preventDefault();setKC(+cards[Math.max(0,i-1)].id.slice(1),true);return}
 if(i<0)return;const r=byN(CASE)[KC],f=cards[i];if(!r)return;
 if("123".includes(k)&&k.length===1){const opts=[r.name,...(r.how==="rule"?[]:r.alts)].filter(x=>x!==cur(r));const x=opts[+k-1];if(x){ev.preventDefault();save(r,x===r.name?null:x)}return}
 if(k==="e"){ev.preventDefault();edit(r,f);return}
 if(k==="v"){ev.preventDefault();if(CLIP)save(r,CLIP===r.name?null:CLIP);else toast("先按 C 复制一个名称");return}
 if(k==="c"){ev.preventDefault();copyName(cur(r));return}});
async function copyName(n){CLIP=n;let ok=false;try{await navigator.clipboard.writeText(n);ok=true}catch(e){}toast(ok?("已复制："+n):("已复制（只在这个页面里能 Paste）："+n))}
document.addEventListener("copy",()=>{try{const s=String(window.getSelection()||"").replace(/\s+/g," ").trim();if(s)CLIP=s}catch(e){}});
async function pasteNow(r,f){let tx="";
 try{if(navigator.clipboard&&navigator.clipboard.readText)tx=(await navigator.clipboard.readText()||"").replace(/\s+/g," ").trim()}catch(e){}
 if(!tx)tx=CLIP;
 if(tx){if(tx!==cur(r))save(r,tx===r.name?null:tx);else toast("名称一样，没有改动");return}
 edit(r,f,true)}
async function saveOrder(o){const c=CASE;undone(c);const prev=ORD[c];ORD[c]=o;render();
 if(!db){toast("这个视图不能保存（请在 claude.ai 登录后打开）。");return}
 try{await db.collection("orders").doc(c).set({case:c,order:o,at:Date.now()});toast("顺序已保存")}
 catch(e){ORD[c]=prev;render();toast("顺序保存失败（"+(e&&e.code||"未知")+"），请再试一次。")}}
async function save(r,name,noUndo){const c=CASE,id=c+"-"+String(r.n).padStart(2,"0");undone(c);const prev=EDIT[r.n];if(!noUndo)UNDO.push({c,r,prev:prev?prev.name:null});
 if(name)EDIT[r.n]={name};else delete EDIT[r.n];ALL[c]=EDIT;render();tabs();
 if(!db){toast("这个视图不能保存（请在 claude.ai 登录后打开）。");return}
 try{const d=db.collection("names").doc(id);if(name)await d.set({case:c,n:r.n,src:r.src,model:r.name,name:name,at:Date.now()});else await d.delete();
  toast(name?("已保存：第 "+r.n+" 张 → "+name):("已还原第 "+r.n+" 张"))}
 catch(e){if(prev)EDIT[r.n]=prev;else delete EDIT[r.n];render();toast("保存失败（"+(e&&e.code||"未知")+"），请再试一次。")}}
[["fAll","all"],["fLow","low"],["fEd","ed"]].forEach(([id,v])=>{q("#"+id).onclick=()=>{filter=v;["fAll","fLow","fEd"].forEach(x=>q("#"+x).setAttribute("aria-pressed",String(x===id)));render()}});
tabs();render();
(function(){const t=q("#tabs"),L=q("#tabL"),R=q("#tabR");
 const upd=()=>{const i=CASES.indexOf(CASE);L.disabled=i<=0;R.disabled=i>=CASES.length-1};
 const go=d=>{const i=CASES.indexOf(CASE)+d;if(i>=0&&i<CASES.length&&t.children[i])t.children[i].click()};
 L.onclick=()=>go(-1);R.onclick=()=>go(1);
 new MutationObserver(()=>{const a=t.querySelector('[aria-current="true"]');if(a){const x=a.getBoundingClientRect().left-t.getBoundingClientRect().left+t.scrollLeft-(t.clientWidth-a.offsetWidth)/2;if(Math.abs(t.scrollLeft-x)>2)t.scrollLeft=Math.max(0,x)}upd()}).observe(t,{childList:true});upd();})();  // 2026-11-09 phone: tab strip scrolls itself, no scrollIntoView (it moved the whole page)
// 2026-11-04 user: one 「完成」 per case -> db status/case_<PLATE> {key,case,done,at}; when every case is done also status/done (old form).
// Claude polls status and does Step 2 for each case as soon as it is done. Editing a done case undoes its 完成.
let askT=null;const KEY=CASES.slice().sort().join(",");
function doneUI(){const b=q("#doneBtn");if(!b)return;const ok=!!DONEC[CASE];b.classList.toggle("ok",ok);b.classList.remove("ask");
 const n=CASES.filter(c=>DONEC[c]).length;
 const NR=matchMedia("(max-width:560px)").matches;b.textContent=(ok?(NR?"":CASE+" ")+"已完成 ✓":"完成"+(NR?"":" "+CASE))+"  ("+n+"/"+CASES.length+")";  // phone: the plate is in the tab, keep the button short
b.disabled=!db}
async function setDone(c,v){try{await db.collection("status").doc("case_"+c).set({key:KEY,case:c,done:v,at:Date.now()});
  const all=CASES.every(x=>x===c?v:DONEC[x]);
  if(all||!v)await db.collection("status").doc("done").set({key:KEY,cases:CASES,done:all,at:Date.now()});
  toast(v?(all?"全部完成，已通知 Claude":"已通知 Claude："+c+" 开始 Step 2"):"已撤销 "+c+" 的「完成」")}catch(e){toast("没保存成功，请再按一次")}}
function undone(c){if(DONEC[c]&&db){DONEC[c]=false;setDone(c,false);toast(c+" 改了，改好后请再按「完成」");tabs();doneUI()}}
q("#doneBtn").onclick=()=>{const b=q("#doneBtn");if(!db){toast("还没连上，请稍等");return}const ok=!!DONEC[CASE];
 if(!b.classList.contains("ask")){b.classList.add("ask");b.textContent=ok?"再按一次撤销":(matchMedia("(max-width:560px)").matches?"再按一次确认":"再按一次确认 "+CASE+" 完成");clearTimeout(askT);askT=setTimeout(doneUI,4000);return}
 clearTimeout(askT);setDone(CASE,!ok)};
new MutationObserver(doneUI).observe(q("#tabs"),{childList:true});
(async()=>{if(!window.claude||!window.claude.use)return;db=await window.claude.use("db");if(!db)return;
 db.collection("status").onSnapshot(s=>{DONEC={};s.docs.forEach(d=>{const x=d.data();if(x&&x.key===KEY&&x.case&&x.done)DONEC[x.case]=true});tabs();doneUI()},()=>{});doneUI();
 db.collection("extras").onSnapshot(s=>{XTR={};s.docs.forEach(d=>{const x=d.data();if(x&&x.case&&x.name)(XTR[x.case]=XTR[x.case]||[]).push({...x,id:x.id||xid(x.case,x.name)})});Object.values(XTR).forEach(a=>a.sort((p,r)=>p.at-r.at));xstrip()},()=>{});
 db.collection("orders").onSnapshot(s=>{ORD={};s.docs.forEach(d=>{const x=d.data();if(x&&x.case&&Array.isArray(x.order))ORD[x.case]=x.order});render()},()=>{});
 db.collection("names").onSnapshot(s=>{ALL={};s.docs.forEach(d=>{const x=d.data();if(!x||!x.case)return;(ALL[x.case]=ALL[x.case]||{})[x.n]={name:x.name}});EDIT=ALL[CASE]||{};tabs();render()},()=>{})})();
